name: Format Pickup Stop Schema

on:
  push:
    branches:
      - feature/auto-dispatch-pickup-stops
    paths:
      - .github/workflows/format-pickup-stop-schema.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-dispatch-pickup-stops
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma format

      - name: Commit formatted schema
        run: |
          if git diff --quiet prisma/schema.prisma; then
            echo "Schema already formatted."
            exit 0
          fi
          git config user.name "speedysweeties-ca"
          git config user.email "speedysweeties@gmail.com"
          git add prisma/schema.prisma
          git commit -m "Format pickup stop Prisma schema"
          git push origin HEAD:feature/auto-dispatch-pickup-stops
