name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: speedy_privacy_synthetic
          POSTGRES_USER: privacy_test
          POSTGRES_PASSWORD: synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacy_test -d speedy_privacy_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      PRIVACY_SYNTHETIC_DATABASE: 'yes'
      DATABASE_URL: postgresql://privacy_test:synthetic-only@127.0.0.1:5432/speedy_privacy_synthetic
      JWT_SECRET: synthetic-privacy-test-key
      FIREBASE_SERVICE_ACCOUNT_JSON: '{}'
      AUTO_DISPATCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          # The schema baseline is an exact, reviewed historical commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run build
      - run: node tests/preparePrivacyDatabase.cjs
      - run: node --test --test-concurrency=1 tests/privacyBaseline.test.js tests/privacyDeletion.database.test.js tests/privacyRoutes.database.test.js tests/privacyDelivery.test.js
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: speedy_sweeties_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d speedy_sweeties_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      # CI-only database; production credentials are never used.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/speedy_sweeties_ci?schema=public
      JWT_SECRET: ci-only-secret
      # Firebase is replaced with a non-network stub when NODE_ENV=test.
      FIREBASE_SERVICE_ACCOUNT_JSON: '{}'
      # Unit tests use mocked data and must never auto-dispatch against the CI database URL.
      AUTO_DISPATCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Check Prisma formatting
        run: npx prisma format --check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Test all backend services
        run: npm test

      - name: Validate timing history against isolated PostgreSQL
        run: |
          node tests/prepareEditPauseDatabase.cjs
          CHECK_EDIT_PAUSE_DATABASE=1 node --test tests/orderEditPause.database.test.js
          CHECK_BND_HISTORY_DATABASE=1 node --test tests/bndWaitingHistory.database.test.js

      - name: Install dispatcher dependencies
        working-directory: speedy-dispatcher
        run: npm ci

      - name: Check dispatcher runtime dependency advisories
        working-directory: speedy-dispatcher
        run: npm audit --omit=dev --audit-level=high

      - name: Check dispatcher
        working-directory: speedy-dispatcher
        run: npm run check
