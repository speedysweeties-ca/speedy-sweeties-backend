name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Used only for Prisma schema parsing; no database command in this workflow connects to it.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/speedy_sweeties_ci?schema=public
      JWT_SECRET: ci-routing-preview-secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            speedy-dispatcher/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check Prisma formatting
        run: npx prisma format --check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Test backend
        run: npm test

      - name: Install Dispatcher dependencies
        working-directory: speedy-dispatcher
        run: npm ci

      - name: Test Dispatcher
        working-directory: speedy-dispatcher
        run: npm test

      - name: Build Dispatcher
        working-directory: speedy-dispatcher
        run: npm run build
