name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      # Used only for Prisma schema parsing and unit tests; CI does not connect to this database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/speedy_sweeties_ci?schema=public
      JWT_SECRET: speedy-sweeties-ci-test-secret-not-for-production
      # Firebase is replaced with a non-network stub when NODE_ENV=test.
      FIREBASE_SERVICE_ACCOUNT_JSON: '{}'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Prisma formatting
        run: npx prisma format --check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test
