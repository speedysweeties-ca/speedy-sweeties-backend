name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # CI-only values. No database command in this workflow connects to this URL.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/speedy_sweeties_ci?schema=public
      JWT_SECRET: ci-only-secret
      FIREBASE_SERVICE_ACCOUNT_JSON: '{}'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Check Prisma formatting
        run: npx prisma format --check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Test backend services
        run: node --test tests/routingPreview.test.js tests/pickupLocationHours.test.js tests/pickupLocationPlaceIdRepair.test.js tests/pickupStoreRouting.test.js

      - name: Install dispatcher dependencies
        working-directory: speedy-dispatcher
        run: npm ci

      - name: Build dispatcher
        working-directory: speedy-dispatcher
        run: npm run build
