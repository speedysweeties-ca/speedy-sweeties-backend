name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: speedy_sweeties_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d speedy_sweeties_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      # CI-only database; production credentials are never used.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/speedy_sweeties_ci?schema=public
      JWT_SECRET: ci-only-secret
      # Firebase is replaced with a non-network stub when NODE_ENV=test.
      FIREBASE_SERVICE_ACCOUNT_JSON: '{}'
      # Unit tests use mocked data and must never auto-dispatch against the CI database URL.
      AUTO_DISPATCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            speedy-dispatcher/package-lock.json

      - name: Verify runtime pins before application checks
        run: node --test --test-concurrency=1 tests/runtimeVersion.test.js

      - name: Require dispatcher help review with workflow changes
        env:
          HELP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/checkDispatcherHelp.cjs

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Check Prisma formatting
        run: npx prisma format --check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Test all backend services
        run: npm test

      - name: Validate timing history against isolated PostgreSQL
        run: |
          node tests/prepareEditPauseDatabase.cjs
          CHECK_EDIT_PAUSE_DATABASE=1 node --test --test-concurrency=1 tests/orderEditPause.database.test.js
          CHECK_BND_HISTORY_DATABASE=1 node --test --test-concurrency=1 tests/bndWaitingHistory.database.test.js

      - name: Install dispatcher dependencies
        working-directory: speedy-dispatcher
        run: npm ci

      - name: Check dispatcher runtime dependency advisories
        working-directory: speedy-dispatcher
        run: npm audit --omit=dev --audit-level=high

      - name: Check dispatcher
        working-directory: speedy-dispatcher
        run: npm run check
