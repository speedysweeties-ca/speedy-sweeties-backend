name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      # CI-only values. No database command in this workflow connects to this URL.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/speedy_sweeties_ci?schema=public
      JWT_SECRET: ci-only-secret
      # Firebase is replaced with a non-network stub when NODE_ENV=test.
      FIREBASE_SERVICE_ACCOUNT_JSON: '{}'
      # Unit tests use mocked data and must never auto-dispatch against the CI database URL.
      AUTO_DISPATCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Check Prisma formatting
        run: npx prisma format --check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Test all backend services
        run: npm test

      - name: Install dispatcher dependencies
        working-directory: speedy-dispatcher
        run: npm ci

      - name: Check dispatcher
        working-directory: speedy-dispatcher
        run: npm run check
