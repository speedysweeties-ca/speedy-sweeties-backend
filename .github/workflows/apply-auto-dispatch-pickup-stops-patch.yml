name: Apply Auto Dispatch Pickup Stops Patch

on:
  push:
    branches:
      - feature/auto-dispatch-pickup-stops
    paths:
      - scripts/applyAutoDispatchPickupStopsPatch.py
      - .github/workflows/apply-auto-dispatch-pickup-stops-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-dispatch-pickup-stops
          fetch-depth: 0

      - name: Apply scoped source patch
        run: python scripts/applyAutoDispatchPickupStopsPatch.py

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "speedysweeties-ca"
          git config user.email "speedysweeties@gmail.com"
          git add src/controllers/order.controller.ts src/controllers/driverOrders.controller.ts src/controllers/orderAssignment.controller.ts
          git commit -m "Integrate pickup-aware auto dispatch"
          git push origin HEAD:feature/auto-dispatch-pickup-stops
